apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: 3-tier-app
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.4
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: configs-volume
              subPath: nginx.conf
              mountPath: /etc/nginx/conf.d/default.conf
              readOnly: true
            - name: configs-volume
              subPath: index.php
              mountPath: /app/public/index.php
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
        - name: backend
          image: 935478558711.dkr.ecr.eu-central-1.amazonaws.com/dev-app:0f979a06483a47820c4d9730ce85f811258ff5e4
          imagePullPolicy: Always
          ports:
            - name: app
              containerPort: 9000
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: configs-volume
              subPath: www.conf
              mountPath: /usr/local/etc/php-fpm.d/www.conf
              readOnly: true
            - name: env-volume
              subPath: .env
              mountPath: /app/.env
              readOnly: true
            - name: laravel-storage-logs-volume
              mountPath: /app/storage/logs
              readOnly: false
            - name: laravel-storage-views-volume
              mountPath: /app/storage/framework/views
              readOnly: false
            - name: bootstrap-cache-volume
              readOnly: false
              mountPath: /app/bootstrap/cache
            - name: tmp
              readOnly: false
              mountPath: /tmp
      volumes:
        - name: configs-volume
          configMap:
            name: backend-configs
            defaultMode: 0555
            items:
              - key: "nginx.conf"
                path: "nginx.conf"
              - key: "index.php"
                path: "index.php"
              - key: "www.conf"
                path: "www.conf"
        - name: env-volume
          secret:
            secretName: backend-secrets
            defaultMode: 0555
            items:
              - key: ".env"
                path: ".env"
        - name: laravel-storage-logs-volume
          emptyDir: {}
        - name: laravel-storage-views-volume
          emptyDir: {}
        - name: bootstrap-cache-volume
          emptyDir: {}
        - name: tmp
          emptyDir: {}
