apiVersion: batch/v1
kind: Job
metadata:
  namespace: 3-tier-app
  name: migrations
  annotations:
    "argocd.argoproj.io/hook": "PreSync"
    "argocd.argoproj.io/hook-delete-policy": "BeforeHookCreation"
spec:
  template:
    metadata:
      labels:
        pod: migrations
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  key: DB_HOST
                  name: backend-configs
          command: ['sh', '-c', 'until nslookup "$DB_HOST"; do echo waiting for database; sleep 2; done;']
      containers:
        - name: database-migrations
          image: "CHANGE_ME"
          imagePullPolicy: Always
          command:
            - "/bin/sh"
            - "-c"
            - "php artisan migrate --force"
          volumeMounts:
            - mountPath: /app/.env
              name: database-migrations
              subPath: ".env"
      restartPolicy: Never
      volumes:
        - name: database-migrations
          secret:
            secretName: database-migrations-secrets
            defaultMode: 0555
            items:
              - key: ".env"
                path: ".env"
  backoffLimit: 0