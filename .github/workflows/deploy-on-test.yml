name: Push new docker image to AWS Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  WORKING_DIR: backend
  ECR_REPOSITORY: dev-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_TEST }}:role/GitHubActionsIAMRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.WORKING_DIR }}
          target: production
          push: true
          load: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
      id-token: write
    env:
      path: k8s/manifests
      backend_repo: 935478558711.dkr.ecr.eu-central-1.amazonaws.com/dev-app
      backend_tag: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Update backend image
        working-directory: ${{ env.path }}
        run: yq -i '(.spec.template.spec.containers[] | select(.name == "backend")).image = "${{ env.backend_repo }}:${{ env.backend_tag }}"' backend.yaml

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add ${{ env.path }}
          git diff --cached --quiet || git commit -m "Update backend image to ${{ env.backend_tag }}"
          git push