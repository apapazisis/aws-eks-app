services:
  nginx:
    container_name: nginx
    image: nginx:1.31.2-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend/public:/app/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - server_net
    depends_on:
      - app

  app:
    container_name: app
    build: ./backend
    networks:
      - server_net
    working_dir: /app
    volumes:
      - ./backend:/app

  pgql:
    image: postgres:15.18
    container_name: pgql
    depends_on:
      - app
      - nginx
    networks:
      - server_net
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=db
      - POSTGRES_USER=secret
      - POSTGRES_PASSWORD=secret
      - POSTGRES_ROOT_PASSWORD=secret
    ports:
      - "7001:5432"

volumes:
  db:
    driver: local

networks:
  server_net:
    driver: bridge