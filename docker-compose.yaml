services:
  nginx:
    container_name: nginx
    image: nginx:1.31.2-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend/public:/app/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - server_net
    depends_on:
      - app

  app:
    container_name: app
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    networks:
      - server_net
    volumes:
      - ./backend:/app

  pgql:
    image: postgres:15.18
    container_name: pgql
    depends_on:
      - app
      - nginx
    networks:
      - server_net
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=db
      - POSTGRES_USER=secret
      - POSTGRES_PASSWORD=secret
      - POSTGRES_ROOT_PASSWORD=secret
    ports:
      - "5432:5432"

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    depends_on:
      - nginx
    network_mode: host
    environment:
      - NGROK_AUTHTOKEN=
    command: http 8000 --url=https://nontransposable-undisconnectedly-weston.ngrok-free.dev --log=stdout --log-level=debug

volumes:
  db:
    driver: local

networks:
  server_net:
    driver: bridge